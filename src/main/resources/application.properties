spring.application.name=api-inovacao

# Carrega as variaveis do arquivo .env (se existir) - os segredos ficam fora do Git
spring.config.import=optional:file:.env[.properties]

#Configuracao de Conexao com o Banco de Dados
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=aguia_branca_db
api.security.token.secret=${JWT_SECRET}

# Integracao com a API gratuita do Google Gemini (pontuacao de viabilidade das ideias)
# A chave fica no .env (fora do Git). Sem a chave, so o endpoint de analise fica indisponivel (503)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.modelo=${GEMINI_MODELO:gemini-2.5-flash}
gemini.api.key=${GEMINI_API_KEY:}
